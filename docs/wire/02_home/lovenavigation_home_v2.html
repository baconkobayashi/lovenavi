<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ホーム — lovenavi</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    background: #f5f4f0;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
    min-height: 100vh;
    color: #1a1a18;
  }

  :root {
    --bg: #ffffff;
    --bg2: #f1efe8;
    --text: #1a1a18;
    --text2: #5f5e5a;
    --text3: #888780;
    --border: rgba(0,0,0,0.12);
    --border2: rgba(0,0,0,0.22);
    --r: 8px;
    --rl: 12px;
    --purple: #534AB7;
    --purple-light: #EEEDFE;
    --purple-mid: #AFA9EC;
    --purple-dark: #3C3489;
  }

  button { font-family: inherit; cursor: pointer; }

  .wrap { width: 400px; }
  .frame {
    border: 0.5px solid var(--border);
    border-radius: var(--rl);
    background: var(--bg);
    overflow: hidden;
  }

  /* Nav */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 0.5px solid var(--border);
  }
  .nav-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: var(--purple-light);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500; color: var(--purple);
    flex-shrink: 0;
  }

  /* Greeting */
  .greeting { padding: 20px 16px 8px; }
  .greeting-sub { font-size: 12px; color: var(--text2); margin: 0 0 2px; }
  .greeting-main { font-size: 18px; font-weight: 500; margin: 0; }

  /* Function cards */
  .cards { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .func-card {
    border: 0.5px solid var(--border);
    border-radius: var(--rl);
    padding: 18px;
    background: var(--bg);
    transition: background 0.15s;
    cursor: pointer;
  }
  .func-card:hover { background: var(--bg2); }
  .func-card.rec { border: 2px solid var(--purple-mid); }

  .badge {
    display: inline-block;
    font-size: 11px; padding: 3px 10px;
    border-radius: 99px;
    background: var(--purple-light); color: var(--purple-dark);
    font-weight: 500; margin-bottom: 10px;
  }
  .func-icon {
    width: 40px; height: 40px;
    border-radius: var(--r);
    background: var(--purple-light);
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
  }
  .func-title { font-size: 15px; font-weight: 500; margin: 0 0 5px; }
  .func-desc { font-size: 12px; color: var(--text2); line-height: 1.6; margin: 0 0 12px; }
  .func-tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .func-tag {
    font-size: 11px; padding: 3px 8px;
    border-radius: 99px;
    background: var(--bg2); color: var(--text2);
    border: 0.5px solid var(--border);
  }
  .func-link { text-align: right; margin-top: 10px; font-size: 12px; color: var(--purple); font-weight: 500; }
  .func-link.muted { color: var(--text3); }

  /* Stats */
  .stats-label { padding: 0 16px 8px; font-size: 12px; font-weight: 500; color: var(--text2); }
  .stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
  .stat { background: var(--bg2); border-radius: var(--r); padding: 12px; }
  .stat-lbl { font-size: 11px; color: var(--text2); margin: 0 0 3px; }
  .stat-val { font-size: 20px; font-weight: 500; margin: 0; }
  .stat-unit { font-size: 13px; font-weight: 400; color: var(--text2); }
  .stat-sub { font-size: 11px; color: var(--text3); margin: 2px 0 0; }

  /* Bottom nav */
  .bnav { display: flex; border-top: 0.5px solid var(--border); }
  .bnav-item {
    flex: 1;
    display: flex; flex-direction: column; align-items: center;
    padding: 10px 0; gap: 3px;
    cursor: pointer;
  }
  .bnav-lbl { font-size: 10px; color: var(--text3); }
  .bnav-lbl.active { color: var(--purple); }
  .bnav-dot { width: 4px; height: 4px; border-radius: 50%; }
  .bnav-dot.active { background: var(--purple); }
</style>
</head>
<body>

<div class="wrap">
  <div class="frame">

    <div class="nav">
      <!-- lovenavi ロゴ: 実測値 love=28px@15px → navi starts at x=60 -->
      <svg width="100" height="28" viewBox="0 0 100 28" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="12" fill="#EEEDFE"/>
        <path d="M14 20 C14 20 7.5 16 7.5 11.5 C7.5 9.1 9.4 7.2 11.8 7.2 C12.9 7.2 14 8.1 14 8.1 C14 8.1 15.1 7.2 16.2 7.2 C18.6 7.2 20.5 9.1 20.5 11.5 C20.5 16 14 20 14 20Z" fill="#534AB7"/>
        <path d="M8.5 14 L19.5 14 M14 8.5 L14 19.5" stroke="white" stroke-width="1.3" stroke-linecap="round" opacity="0.55"/>
        <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="500" fill="#534AB7" letter-spacing="-0.2">love</text>
        <text x="60" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="400" fill="#1a1a18" letter-spacing="-0.2">navi</text>
      </svg>
      <div class="nav-avatar">田</div>
    </div>

    <div class="greeting">
      <p class="greeting-sub">おかえりなさい</p>
      <p class="greeting-main">今日はどうする？</p>
    </div>

    <div class="cards">
      <div class="func-card rec">
        <span class="badge">おすすめ</span>
        <div class="func-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round">
            <path d="M2 9C2 5.1 5.1 2 9 2s7 3.1 7 7-3.1 7-7 7H2.8L2 16V9z"/>
          </svg>
        </div>
        <p class="func-title">初回アプローチを作る</p>
        <p class="func-desc">相手のプロフィールを入力すると、好印象を与える最初のメッセージを自動生成します。</p>
        <div class="func-tags">
          <span class="func-tag">相手の年齢</span>
          <span class="func-tag">趣味・好み</span>
          <span class="func-tag">居住エリア</span>
        </div>
        <div class="func-link">使ってみる →</div>
      </div>

      <div class="func-card">
        <div class="func-icon">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round">
            <rect x="2" y="4" width="14" height="10" rx="2"/>
            <path d="M2 7l7 5 7-5"/>
          </svg>
        </div>
        <p class="func-title">返信メッセージを作る</p>
        <p class="func-desc">相手の返信内容と目的を入れると、状況に合った返信を3パターン提案します。</p>
        <div class="func-tags">
          <span class="func-tag">相手の返信</span>
          <span class="func-tag">やり取り回数</span>
          <span class="func-tag">目的</span>
        </div>
        <div class="func-link muted">使ってみる →</div>
      </div>
    </div>

    <p class="stats-label">あなたの履歴</p>
    <div class="stat-row">
      <div class="stat">
        <p class="stat-lbl">生成したメッセージ</p>
        <p class="stat-val">12<span class="stat-unit"> 件</span></p>
        <p class="stat-sub">今月</p>
      </div>
      <div class="stat">
        <p class="stat-lbl">返信きた報告</p>
        <p class="stat-val">8<span class="stat-unit"> 件</span></p>
        <p class="stat-sub">返信率 67%</p>
      </div>
    </div>

    <div class="bnav">
      <div class="bnav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#534AB7" stroke-width="1.5" stroke-linecap="round">
          <path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/>
        </svg>
        <span class="bnav-lbl active">ホーム</span>
        <div class="bnav-dot active"></div>
      </div>
      <div class="bnav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round">
          <path d="M4 6h12M4 10h8M4 14h5"/>
        </svg>
        <span class="bnav-lbl">履歴</span>
        <div class="bnav-dot"></div>
      </div>
      <div class="bnav-item">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round">
          <circle cx="10" cy="7" r="3"/>
          <path d="M4 17c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
        </svg>
        <span class="bnav-lbl">マイページ</span>
        <div class="bnav-dot"></div>
      </div>
    </div>

  </div>
</div>

</body>
</html>
